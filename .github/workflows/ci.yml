name: Treasury Control Center CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: projects/treasury-liquidity-control-center/backend/pom.xml
      - name: Verify backend (unit + PostgreSQL integration tests)
        working-directory: projects/treasury-liquidity-control-center/backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/treasury-liquidity-control-center/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t treasury-api:ci projects/treasury-liquidity-control-center/backend
      - name: Build frontend image
        run: docker build -t treasury-frontend:ci projects/treasury-liquidity-control-center/frontend
